spring.application.name=CourseMatch

server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5432/coursematch_db

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.bernate.format_sql=true